[project]
name = "gutp-notify-dispatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gutp-shared",
]

[tool.uv.sources]
gutp-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
