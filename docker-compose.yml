name: workorder-impl

services:

  # ── メッセージバス ─────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      retries: 5

  # ── バックエンド（全ビジネスロジック統合） ────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - BUILDING_OS_URL=${BUILDING_OS_URL:-http://localhost:5000}
      - BUILDING_OS_TOKEN=${BUILDING_OS_TOKEN:-}
      - BUILDING_SYNC_INTERVAL_SEC=300
      - ESCALATION_THRESHOLD_SEC=1800
      - ESCALATION_CHECK_INTERVAL_SEC=60
      - SCHEDULE_INTERVAL_SEC=300
      - NOTIFY_ADAPTER=${NOTIFY_ADAPTER:-email}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── 運用ダッシュボード（UI BFF + 静的配信） ───────────────────────────
  ops-dashboard:
    build:
      context: .
      dockerfile: services/ops_dashboard/Dockerfile
    ports:
      - "8006:8000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
